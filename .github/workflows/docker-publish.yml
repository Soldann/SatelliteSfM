name: Publish Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Miniconda installer
        run: |
          wget -q https://repo.anaconda.com/miniconda/Miniconda3-py38_4.12.0-Linux-x86_64.sh \
            -O Miniconda3-installer.sh

      - name: Download ColmapForVisSat dependency archives
        run: |
          mkdir -p preprocess_sfm/ColmapForVisSat/build/__download__
          cd preprocess_sfm/ColmapForVisSat/build/__download__
          BASE="https://github.com/jayin92/SatelliteSfM/releases/download/deps"
          for f in ceres-solver-1.14.0.zip eigen-3.3.5.zip FreeImage3180.zip \
                   gflags-2.2.1.zip glew-2.1.0.zip suite-sparse.zip; do
            wget -q "$BASE/$f"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jayin92/satellitesfm
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
